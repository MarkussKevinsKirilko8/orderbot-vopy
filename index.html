<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скопировать</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #status {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    #subtext {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #999);
    }
    button {
      margin-top: 24px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="status">Копирую…</div>
  <div id="subtext"></div>
  <button id="manualBtn" hidden>Скопировать вручную</button>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      const status = document.getElementById('status');
      const subtext = document.getElementById('subtext');
      const manualBtn = document.getElementById('manualBtn');

      const blob = decodeURIComponent((window.location.hash || '').slice(1));

      if (!blob) {
        status.textContent = '⚠️ Нет данных для копирования';
        return;
      }

      function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      async function attemptCopy() {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(blob);
            return true;
          } catch (e) { /* fall through */ }
        }
        return legacyCopy(blob);
      }

      async function doCopyAndClose() {
        const ok = await attemptCopy();
        if (ok) {
          status.textContent = '✅ Скопировано';
          subtext.textContent = 'Закрываю…';
          if (tg && tg.HapticFeedback) {
            try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
          }
          setTimeout(() => { if (tg) tg.close(); }, 500);
        } else {
          status.textContent = '⚠️ Нужно нажать кнопку';
          subtext.textContent = 'Браузер не разрешает автокопирование';
          manualBtn.hidden = false;
        }
      }

      manualBtn.addEventListener('click', doCopyAndClose);

      // Try once automatically — most Telegram clients allow it because the
      // Mini App was launched in response to the user's button tap.
      doCopyAndClose();
    })();
  </script>
</body>
</html>
