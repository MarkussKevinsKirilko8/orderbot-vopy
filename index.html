<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Скопировать</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #status {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 28px;
    }
    button {
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="status">Шифр готов</div>
  <button id="copyBtn">Копировать</button>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      const status = document.getElementById('status');
      const copyBtn = document.getElementById('copyBtn');

      // window.location.hash holds our blob, but Telegram appends its own
      // session params (?tgWebAppData=..., etc.) after the fragment in some
      // clients. Strip everything from the first '?' onward to recover the
      // pure encrypted blob.
      const rawHash = (window.location.hash || '').slice(1);
      const blobOnly = rawHash.split('?')[0];
      let blob = '';
      try {
        blob = decodeURIComponent(blobOnly);
      } catch (e) {
        blob = blobOnly;
      }

      if (!blob) {
        status.textContent = '⚠️ Нет данных';
        copyBtn.disabled = true;
        return;
      }

      function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      async function doCopy() {
        let ok = false;
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(blob);
            ok = true;
          } catch (e) { /* fall through to legacy */ }
        }
        if (!ok) ok = legacyCopy(blob);

        if (ok) {
          status.textContent = '✅ Скопировано';
          copyBtn.style.display = 'none';
          if (tg && tg.HapticFeedback) {
            try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
          }
          setTimeout(() => { if (tg) tg.close(); }, 500);
        } else {
          status.textContent = '⚠️ Не удалось скопировать';
        }
      }

      copyBtn.addEventListener('click', doCopy);
    })();
  </script>
</body>
</html>
