<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Скопировать</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #status {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 28px;
    }
    button {
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="status">Шифр готов</div>
  <button id="copyBtn">Копировать</button>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      const status = document.getElementById('status');
      const copyBtn = document.getElementById('copyBtn');

      // Fragment format (current bot — v=4+):
      //   #enc=<encrypted-blob>&plain=<readable-json>
      // The encrypted blob is what gets copied to the user's clipboard.
      // The plain JSON is what gets POSTed to the Edge Function so the
      // notification has a useful payload (the function never sees the
      // encryption key).
      //
      // Fallback: older bot replies (cached Mini App URLs at v=3 etc.)
      // had just the raw encrypted blob in the fragment. We still copy
      // it; just no plain JSON to notify with.
      //
      // Telegram appends its own session params (?tgWebAppData=...,
      // &user=..., &tgWebAppVersion=..., etc.) onto the URL in some
      // clients. Strip from the first such marker before parsing so it
      // doesn't leak into our values.
      function readFragment() {
        let frag = (window.location.hash || '').slice(1);
        if (!frag) return { enc: '', plain: '' };

        // Strip Telegram-appended session params (?tgWebAppData=...,
        // &user=..., &tgWebAppVersion=..., etc.) before parsing.
        const tgIdx = frag.search(/[?&]tgWebApp[A-Za-z]+=/);
        if (tgIdx >= 0) frag = frag.slice(0, tgIdx);

        // IMPORTANT: do NOT use URLSearchParams here — it follows the
        // x-www-form-urlencoded rule that '+' means space, but our
        // encrypted base64 blob legitimately contains '+'. URLSearchParams
        // would corrupt the clipboard contents into spaces.
        // decodeURIComponent leaves '+' alone, which is what we want.
        function dec(s) {
          try { return decodeURIComponent(s); } catch (e) { return s; }
        }

        if (frag.startsWith('enc=')) {
          const plainSep = frag.indexOf('&plain=');
          if (plainSep >= 0) {
            return {
              enc:   dec(frag.slice('enc='.length, plainSep)),
              plain: dec(frag.slice(plainSep + '&plain='.length)),
            };
          }
          return { enc: dec(frag.slice('enc='.length)), plain: '' };
        }

        // Old single-blob format (cached Mini App URLs at v=3 etc.)
        return { enc: dec(frag), plain: '' };
      }

      const { enc: blob, plain: cleanJson } = readFragment();

      if (!blob) {
        status.textContent = '⚠️ Нет данных';
        copyBtn.disabled = true;
        return;
      }

      function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      function showNotifyStatus(msg) {
        let div = document.getElementById('notify-status');
        if (!div) {
          div = document.createElement('div');
          div.id = 'notify-status';
          div.style.fontSize = '13px';
          div.style.color = 'var(--tg-theme-hint-color, #888)';
          div.style.marginTop = '18px';
          div.style.maxWidth = '92%';
          div.style.wordBreak = 'break-word';
          document.body.appendChild(div);
        }
        div.textContent = 'Notify: ' + msg;
      }

      async function notifyOrderCopied() {
        if (!cleanJson) {
          // Bot is on old URL format. Tell the user — don't auto-close so
          // they can read it.
          showNotifyStatus('пропущена — нет plain JSON. Обнови бот (?v=4 или старше)');
          return false;
        }
        const initData = (tg && tg.initData) || '';
        if (!initData) {
          showNotifyStatus('initData пуст — открой через бота, не через прямую ссылку');
          return false;
        }
        try {
          const res = await fetch('https://app-notification.x8x.pro/functions/v1/order-copied', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            keepalive: true,
            body: JSON.stringify({
              init_data: initData,
              order_json: cleanJson,
            }),
          });
          if (res.ok) {
            showNotifyStatus(`HTTP ${res.status} ✅`);
            return true;
          }
          let txt = '';
          try { txt = await res.text(); } catch (e) {}
          showNotifyStatus(`HTTP ${res.status}: ${txt.slice(0, 120)}`);
          return false;
        } catch (e) {
          showNotifyStatus('fetch error: ' + ((e && e.message) || e));
          return false;
        }
      }

      async function doCopy() {
        let ok = false;
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(blob);
            ok = true;
          } catch (e) { /* fall through to legacy */ }
        }
        if (!ok) ok = legacyCopy(blob);

        if (ok) {
          status.textContent = '✅ Скопировано';
          copyBtn.style.display = 'none';
          if (tg && tg.HapticFeedback) {
            try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
          }
          // Wait for the notify before closing so the user sees the
          // result (or the error) before the page disappears.
          const notifyOk = await notifyOrderCopied();
          if (notifyOk) {
            setTimeout(() => { if (tg) tg.close(); }, 900);
          }
          // If notify failed/skipped, leave the page open so the user can
          // read the diagnostic and report it.
        } else {
          status.textContent = '⚠️ Не удалось скопировать';
        }
      }

      copyBtn.addEventListener('click', doCopy);
    })();
  </script>
</body>
</html>
